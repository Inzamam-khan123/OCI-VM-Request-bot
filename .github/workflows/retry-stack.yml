name: OCI Stack Retry

on:
  workflow_dispatch:

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # stay under GitHub's 6h (360min) hard job cap
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_CLI_USER }}
          fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_CLI_TENANCY }}
          region=${{ secrets.OCI_CLI_REGION }}
          key_file=~/.oci/key.pem
          EOF

      - name: Hunt loop
        run: |
          END=$((SECONDS+21000))   # ~350 minutes, leaves buffer before timeout-minutes cutoff
          while [ $SECONDS -lt $END ]; do
            echo "[$(date -u +%T)] Attempting stack apply..."
            oci resource-manager job create-apply-job \
              --stack-id ${{ secrets.OCI_STACK_ID }} \
              --execution-plan-strategy AUTO_APPROVED \
              --wait-for-state SUCCEEDED --wait-for-state FAILED \
              --max-wait-seconds 120 > job_output.json 2>&1

            if grep -q '"lifecycle-state": "SUCCEEDED"' job_output.json; then
              echo "************************************************"
              echo "SUCCESS! Instance is provisioning."
              cat job_output.json
              exit 0
            fi

            JITTER=$(( (RANDOM % 10) + 1 ))
            WAIT=$((360 + JITTER))
            echo "Result: not succeeded yet. Retrying in ${WAIT}s..."
            sleep $WAIT
          done
          echo "Loop window ended without success. Retriggering a fresh run..."

      - name: Retrigger self
        if: always()
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/retry-stack.yml/dispatches \
            -d '{"ref":"main"}'
