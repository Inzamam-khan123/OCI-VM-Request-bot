name: OCI Stack Retry

on:
  schedule:
    - cron: "17 * * * *"   # watchdog: hourly, restarts the chain if it died
  workflow_dispatch:

permissions:
  actions: write           # needed to retrigger itself
  contents: read

concurrency:
  group: oci-retry         # only one hunter at a time
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # stay under GitHub's 6h cap
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_CLI_USER }}
          fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_CLI_TENANCY }}
          region=${{ secrets.OCI_CLI_REGION }}
          key_file=~/.oci/key.pem
          EOF

      - name: Hunt loop
        id: hunt
        env:
          A1_ID: ${{ secrets.OCI_STACK_ID }}              # VM1 (ARM) stack
          MICRO_ID: ${{ secrets.OCI_STACK_ID_MICRO }}     # micro stack
        run: |
          try_apply() {                                   # returns 0 only if the apply SUCCEEDED
            oci resource-manager job create-apply-job \
              --stack-id "$1" \
              --execution-plan-strategy AUTO_APPROVED \
              --wait-for-state SUCCEEDED --wait-for-state FAILED \
              --max-wait-seconds 120 > job_output.json 2>&1 || true   # keep loop alive on failure
            grep -q '"lifecycle-state": "SUCCEEDED"' job_output.json
          }

          END=$((SECONDS+21000))                          # ~350 min loop window
          TURN=0                                          # 0 = VM1, 1 = micro
          A1_DONE=0
          MICRO_DONE=0

          while [ $SECONDS -lt $END ]; do
            ATTEMPTED=0

            if [ $TURN -eq 0 ] && [ $A1_DONE -eq 0 ]; then
              echo "[$(date -u +%T)] Attempting VM1 (ARM) stack..."
              ATTEMPTED=1
              if try_apply "$A1_ID"; then
                echo "SUCCESS: VM1 is provisioning."
                A1_DONE=1
              fi
            elif [ $TURN -eq 1 ] && [ $MICRO_DONE -eq 0 ]; then
              echo "[$(date -u +%T)] Attempting micro stack..."
              ATTEMPTED=1
              if try_apply "$MICRO_ID"; then
                echo "SUCCESS: micro is provisioning."
                MICRO_DONE=1
              fi
            fi

            TURN=$(( 1 - TURN ))                          # switch to the other stack

            if [ $A1_DONE -eq 1 ] && [ $MICRO_DONE -eq 1 ]; then
              echo "Both stacks succeeded."
              echo "success=true" >> $GITHUB_OUTPUT        # stops the chain from retriggering
              exit 0
            fi

            if [ $ATTEMPTED -eq 1 ]; then                 # only wait after a real attempt
              JITTER=$(( (RANDOM % 10) + 1 ))             # random 1-10s
              WAIT=$((600 + JITTER))                      # 10 min + jitter
              echo "Retrying the other stack in ${WAIT}s..."
              sleep $WAIT
            fi
          done

      - name: Retrigger self
        if: always() && steps.hunt.outputs.success != 'true'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/retry-stack.yml/dispatches \
            -d '{"ref":"main"}'
